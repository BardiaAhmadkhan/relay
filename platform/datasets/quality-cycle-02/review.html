<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Relay · Quality comparison</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%2323382e'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --paper: #f5f3ed;
        --ink: #202b25;
        --muted: #59665c;
        --line: #d8ddd3;
        --green: #2f6548;
        --red: #993d32;
        --amber: #805d25;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font:
          15px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 1380px;
        margin: auto;
        padding: 40px 28px;
      }
      header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        gap: 32px;
        border-bottom: 1px solid var(--line);
        padding-bottom: 28px;
      }
      .brand {
        font-size: 24px;
        font-weight: 750;
        letter-spacing: -0.04em;
      }
      h1 {
        font-size: clamp(30px, 4vw, 48px);
        line-height: 1.12;
        letter-spacing: -0.045em;
        margin: 18px 0 16px;
      }
      h2 {
        font-size: 22px;
        letter-spacing: -0.025em;
      }
      p {
        margin: 8px 0;
      }
      .intro {
        max-width: 790px;
        color: var(--muted);
      }
      a {
        color: inherit;
        text-underline-offset: 3px;
      }
      .links {
        display: grid;
        gap: 8px;
        flex-shrink: 0;
        font-size: 13px;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 24px;
        margin: 26px 0;
      }
      .stat {
        padding: 8px 0 20px;
        border-bottom: 1px solid var(--line);
      }
      .stat strong {
        display: block;
        font-size: 30px;
        font-weight: 650;
        letter-spacing: -0.035em;
      }
      .stat span {
        font-size: 13px;
        color: var(--muted);
      }
      .note {
        max-width: 1050px;
        color: var(--muted);
        font-size: 13px;
      }
      .filters {
        display: grid;
        grid-template-columns: 1.4fr 1fr 1fr;
        gap: 14px;
        margin: 28px 0 14px;
      }
      label {
        font-size: 12px;
        color: var(--muted);
        display: grid;
        gap: 6px;
      }
      input,
      select,
      button {
        font: inherit;
        color: var(--ink);
      }
      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #fffefa;
      }
      button {
        cursor: pointer;
      }
      button:focus-visible,
      a:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 3px solid #326449;
        outline-offset: 3px;
      }
      .list-line {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: center;
        margin: 18px 0;
        color: var(--muted);
        font-size: 13px;
      }
      .pagination {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .pagination button,
      .close {
        background: transparent;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 13px;
      }
      .pagination button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
      .card {
        background: #fffefa;
        border: 1px solid var(--line);
        border-radius: 13px;
        overflow: hidden;
      }
      .image-button {
        border: 0;
        background: #e8ebe4;
        display: block;
        width: 100%;
        padding: 0;
      }
      .image-button img {
        display: block;
        width: 100%;
        height: 250px;
        object-fit: contain;
      }
      .body {
        padding: 18px;
      }
      .id {
        font-size: 12px;
        font-weight: 650;
        letter-spacing: 0.025em;
      }
      .status {
        display: inline-block;
        margin-left: 8px;
        font-size: 11px;
        color: var(--muted);
      }
      .bad {
        color: var(--red);
      }
      .good {
        color: var(--green);
      }
      .neutral {
        color: var(--amber);
      }
      .reference {
        font-size: 12px;
        color: var(--muted);
      }
      .finding {
        font-size: 13px;
        margin: 12px 0;
        display: -webkit-box;
        -webkit-line-clamp: 4;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .credit {
        font-size: 11px;
        color: var(--muted);
        margin-top: 14px;
      }
      .change {
        font-size: 12px;
        color: var(--green);
        margin: 12px 0;
      }
      .empty {
        padding: 40px;
        border: 1px solid var(--line);
        grid-column: 1/-1;
      }
      .footer {
        margin: 30px 0;
        font-size: 12px;
        color: var(--muted);
        max-width: 1100px;
      }
      dialog {
        padding: 0;
        border: 1px solid var(--line);
        border-radius: 16px;
        width: 95vw;
        max-width: 1160px;
        max-height: 92vh;
        background: var(--paper);
        color: var(--ink);
      }
      dialog::backdrop {
        background: #18201bd0;
      }
      .dialog-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 18px;
        padding: 16px 22px;
        border-bottom: 1px solid var(--line);
      }
      .detail {
        padding: 22px;
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        gap: 24px;
      }
      .detail img {
        width: 100%;
        height: auto;
        max-height: 72vh;
        object-fit: contain;
        background: #e8ebe4;
      }
      .detail h3 {
        font-size: 15px;
        margin: 20px 0 6px;
      }
      .detail p,
      .detail li {
        font-size: 13px;
      }
      .detail ul {
        padding-left: 18px;
      }
      .side {
        border-left: 2px solid var(--line);
        padding-left: 14px;
        margin-top: 18px;
      }
      .side.after {
        border-color: var(--green);
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .count-badge {
        font-variant-numeric: tabular-nums;
      }
      @media (max-width: 980px) {
        .grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @media (max-width: 620px) {
        main {
          padding: 24px 16px;
        }
        header {
          display: block;
        }
        .links {
          margin-top: 20px;
          display: flex;
          flex-wrap: wrap;
          gap: 14px;
        }
        .stats {
          grid-template-columns: 1fr 1fr;
          gap: 14px;
        }
        .stat strong {
          font-size: 27px;
        }
        .filters,
        .grid,
        .detail {
          grid-template-columns: 1fr;
        }
        .image-button img {
          height: 290px;
        }
        .detail img {
          max-height: 45vh;
        }
        .list-line {
          align-items: start;
          flex-direction: column;
        }
        .dialog-head {
          padding: 14px;
        }
        .detail {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="brand">relay / quality review</div>
          <h1>Inspection, tested against the photographs.</h1>
          <p class="intro">
            Compare the original and revised evidence with a frozen visual reference. Open any
            photograph to inspect its findings, remaining errors and source attribution.
          </p>
        </div>
        <nav class="links" aria-label="Review downloads">
          <a href="../../docs/15-testing-and-qa/quality-cycle-02.md">Full report</a

      </header>
      <div class="stats" id="stats"></div>
      <p class="note" id="scope"></p>
      <section class="filters" aria-label="Filter results">
        <label
          >Find a photograph<input
            id="search"
            type="search"
            placeholder="Image ID, reference or observation" /></label
        ><label
          >Dataset<select id="dataset">
            <option value="audit">Current HTTP audit · 194 images</option>
            <option value="validation">Additional validation · 64 images</option>
          </select></label

          >Result<select id="outcome">
            <option value="all">All results</option>
            <option value="improved">Improved by the change</option>
            <option value="failure">Remaining visual failures</option>
            <option value="matched">Reference defect matched</option>
            <option value="negative">Negative controls</option>
            <option value="unscored">Ambiguous or unassessable</option>
            <option value="regression">New regressions</option>
          </select></label
        >
      </section>
      <div class="list-line">
        <span id="count" aria-live="polite"></span>
        <div class="pagination">
          <button id="prev" aria-label="Previous page">Previous</button
          ><span id="page" class="count-badge"></span
          ><button id="next" aria-label="Next page">Next</button>
        </div>
      </div>
      <div id="grid" class="grid"></div>
      <p class="footer" id="footer"></p>
    </main>
    <dialog id="dialog">
      <div class="dialog-head">
        <strong id="detail-title"></strong><button id="close" class="close">Close</button>
      </div>
      <div id="detail" class="detail"></div>
    </dialog>

3e0ba02b651ade57ddc0c32c7dbd53dbb7ec75e0f8706239ae263a18","width":960,"height":724,"description":"Left: Wested \"ROLA Special\" in authentic lamb; Right: Distressed Horsehide ?? Indy style jacket.\nI posted these photos of a Wested Leather \"Indiana Jones\" style jacket on the Club Obi Wan Indygear forum with the following query:\nI recently picked up a \"vintage\" Wested Indy-style jacket via online auction. The listing described the jacket as \"distressed horsehide.\" After I won the auction, I emailed the seller asking him if he knew anything more about the jacket. He kindly replied that he is a member of a leather jacket forum, that he owns and wears a number of leather jackets, and he occasionally sells those he is not wearing. He said he purchased this particular Wested Indy jacket second-hand from a shop in London eight to ten years ago, wore it for a short time, and it has since been in storage. He said this jacket was manufactured as \"distressed\" by Wested.\nThe jacket feels quite heavy, particularly compared to my only other Indy jacket, a Wested ROLA special in authentic lamb ( purchased at auction several years ago). The zipper is a heavy brass YKK as opposed to the nickel-plated ROLA zipper, and the jacket zips on the \"American side\" rather than European like the ROLA. The jacket is a size 40, the same as my ROLA.\nI'm curious as to whether it is possible to narrow down the approximate manufacture date of this jacket, the model or style of the jacket, and to determine if it is, indeed, horsehide. I know Wested has manufactured a wide variety of Indy-style jackets over the years from a number of hide types, so pinning down the exact style of this jacket might be a challenge. It is, however, the type of challenge I know some of you here might find entertaining! I'd appreciate your opinions!\n\nI'm sorry I don't have dimensions at hand at the moment. Let me know if you ","group":"commons-133877793","groupReviewPending":false,"transform":"Commons thumbn       const el = (tag, text, cls) => {

              ? c.candidateFlag
                ? 'False alert'

              : {
                  matched: 'Defect matched',
                  partial: 'Defect misdescribed',
                  missed: 'Defect missed',
                }[c.correspondenceAfter] || 'Review incomplete';
      const fail = (c) =>
        !!c.error ||
        (c.condition === 'no_visible_defect' && c.candidateFlag) ||
        (c.condition === 'visible_defect' && c.correspondenceAfter !== 'matched');
      function credit(c) {
        const p = el('p', undefined, 'credit');
        try {
          const u = new URL(c.source);
          if (u.protocol === 'https:') {
            const a = el('a', 'Source photograph');
            a.href = u.href;
            a.target = '_blank';
            a.rel = 'noopener';
            p.append(a, document.createTextNode(' · '));
          }
        } catch {}
        p.append(document.createTextNode(c.author + ' · ' + c.license));
        return p;
      }
      function findings(photo) {
        return photo?.findings || [];

      function phrase(photo) {
        return (
          findings(photo)
            .map((f) => f.kind + ': ' + f.evidence)
            .join(' · ') || 'No finding returned.'
        );
      }
      function list() {
        const query = document.querySelector('#search').value.toLowerCase(),
          set = document.querySelector('#dataset').value,
          outcome = document.querySelector('#outcome').value;
        return DATA.rows.filter((c) => {
          if (c.dataset !== set) return false;
          if (outcome === 'improved' && !c.improved) return false;
          if (outcome === 'failure' && !fail(c)) return false;
          if (outcome === 'matched' && c.correspondenceAfter !== 'matched') return false;
          if (outcome === 'negative' && c.condition !== 'no_visible_defect') return false;
          if (outcome === 'unscored' && !['ambiguous', 'unassessable'].includes(c.condition))
            return false;
          if (outcome === 'regression' && !c.regression) return false;
          return (
            !query ||
            [c.id, c.visualBasis, c.title || '', phrase(c.baselinePhoto), phrase(c.candidatePhoto)]
              .join(' ')
              .toLowerCase()
              .includes(query)

        });
      }
      function summary() {
        const key = document.querySelector('#dataset').value,
          m = DATA.metrics[key];

        root.replaceChildren();
        const fields = [

            'Defects correctly described / ' + m.positives,
          ],
          [
            m.baselineFalse + ' → ' + m.candidateFalse,
            'False alerts / ' + m.negatives + ' negative controls',

          [

        ];
        for (const [number, label] of fields) {

        document.querySelector('#scope').textContent =

      function render() {

        for (const c of selected.slice(page * pageSize, (page + 1) * pageSize)) {

          evidence('Revised evidence', c.candidatePhoto, 'after'),
        );
        if (c.reviewNote) body.append(el('h3', 'Correspondence review'), el('p', c.reviewNote));
        if (c.requestElapsedMs != null)
          body.append(
            el(
              'p',
              'First HTTP request: ' +
                sec(c.requestElapsedMs) +
                '; baseline replay uses exactly captured model responses.',
              'muted',
            ),
          );
        body.append(credit(c));
        root.append(images, body);
        document.querySelector('#dialog').showModal();
      }
      for (const id of ['search', 'dataset', 'outcome'])
        document
          .querySelector('#' + id)
          .addEventListener(id === 'search' ? 'input' : 'change', () => {
            page = 0;
            render();
          });
      document.querySelector('#prev').onclick = () => {
        page--;
        render();
      };
      document.querySelector('#next').onclick = () => {
        page++;
        render();
      };
      document.querySelector('#close').onclick = () => document.querySelector('#dialog').close();
      document.querySelector('#footer').textContent = DATA.footer;
      render();
    </script>
  </body>
</html>
